<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VDP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Rubik:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;
  --bg:#f3f4f1;--fg:#111;--fg2:#585959;--acc:#03a132;--acc-t:#027a26;--tint:rgba(3,161,50,.10);
  --glass:rgba(255,255,255,.58);--edge:rgba(255,255,255,.75);--line:rgba(0,0,0,.08);--field:rgba(0,0,0,.04);
  --shadow:0 18px 44px -22px rgba(30,40,30,.35);--alert:#c23d08;--wait:#946c00;--info:#1f6f9e;--on-acc:#fff;--contour:rgba(17,17,17,.07)}
:root[data-hx="dark"]{color-scheme:dark;
  --bg:#0d0e10;--fg:#fff;--fg2:#8c8e96;--acc:#05ed49;--acc-t:#4dff7e;--tint:rgba(5,237,73,.12);
  --glass:rgba(25,27,30,.60);--edge:rgba(255,255,255,.10);--line:rgba(255,255,255,.08);--field:rgba(255,255,255,.05);
  --shadow:0 18px 44px -22px rgba(0,0,0,.7);--on-acc:#06241a;--contour:rgba(255,255,255,.06)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font:400 14px/1.5 Manrope,system-ui,"Segoe UI",sans-serif;color:var(--fg);background:var(--bg);overflow-x:hidden;
  background-image:radial-gradient(520px 380px at 12% 8%,var(--tint),transparent 70%),radial-gradient(480px 420px at 95% 55%,var(--tint),transparent 70%)}
.contours{position:fixed;inset:0;z-index:-1;width:100%;height:100%}
.contours ellipse{fill:none;stroke:var(--contour);stroke-width:1}
main{max-width:520px;margin:0 auto;padding:20px 16px 28px;display:grid;gap:14px}
h1,h2,.mono,button,.seg label,.pill{font-family:Rubik,system-ui,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px}
header h1{font-size:20px;font-weight:500;letter-spacing:-.01em}
header small{display:block;color:var(--fg2);font-size:12px;font-variant-numeric:tabular-nums}
header .sp{flex:1}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:16px;box-shadow:var(--shadow);
  backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);padding:16px}
.card h2{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card p.hint{color:var(--fg2);font-size:12.5px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--field)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.ok{color:var(--acc-t)}.wait{color:var(--wait)}.alert{color:var(--alert)}.info{color:var(--info)}
.row{display:flex;align-items:center;gap:10px}
.screens{display:grid;gap:8px;margin-bottom:12px}
.screen{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--field);border:1px solid var(--line)}
.screen .name{font:500 13px Rubik,sans-serif;min-width:62px}
.seg{display:flex;flex:1;gap:2px;padding:2px;border-radius:10px;background:var(--line)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1;text-align:center;font-size:12.5px;font-weight:500;padding:6px 4px;border-radius:8px;cursor:pointer;color:var(--fg2);white-space:nowrap}
.seg input:checked+label{background:var(--acc);color:var(--on-acc)}
.seg input:focus-visible+label{outline:2px solid var(--acc);outline-offset:2px}
button{font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--field);color:var(--fg);padding:8px 14px;border-radius:10px;cursor:pointer;transition:transform .12s,background .12s}
button:hover{background:var(--line)}button:active{transform:scale(.97)}
button:focus-visible,select:focus-visible,.key:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.primary{background:var(--acc);color:var(--on-acc);border-color:transparent}
button.primary:hover{filter:brightness(1.06);background:var(--acc)}
button.danger{color:var(--alert)}
button:disabled{opacity:.45;cursor:default;transform:none}
button.icon{padding:6px 8px;line-height:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.key{flex:1;min-height:38px;border-radius:10px;border:1px dashed var(--line);background:var(--field);display:flex;align-items:center;gap:6px;padding:0 12px;cursor:pointer;color:var(--fg2);font-size:13px}
.key.rec{border-color:var(--acc);color:var(--acc-t)}
kbd{font:500 12px Rubik,sans-serif;padding:2px 8px;border-radius:6px;background:var(--line);color:var(--fg)}
select{width:100%;font:500 13px Rubik,sans-serif;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--fg)}
select option{color:#111}
.msg{font-size:12.5px;margin-top:10px;min-height:18px}
#theme .sun{display:none}:root[data-hx="dark"] #theme .sun{display:inline}:root[data-hx="dark"] #theme .moon{display:none}
dialog{margin:auto;border:1px solid var(--edge);border-radius:16px;background:var(--bg);color:var(--fg);padding:18px;width:min(380px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.35);backdrop-filter:blur(3px)}
dialog h2{font-size:15px;font-weight:600;margin-bottom:4px}
dialog .seg{margin:12px 0 16px}
dialog .actions{justify-content:flex-end}
#lang{font-size:12px;padding:6px 10px}
.hide{display:none!important}
.num{font-variant-numeric:tabular-nums}
.busy{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.25);backdrop-filter:blur(3px);z-index:9}
.busy .card{display:flex;gap:10px;align-items:center}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--acc);animation:s .9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<svg class="contours" aria-hidden="true" preserveAspectRatio="xMidYMid slice" viewBox="0 0 800 1000">
  <g transform="translate(560 220)"><ellipse rx="60" ry="40" transform="rotate(-20)"/><ellipse rx="110" ry="75" transform="rotate(-20)"/><ellipse rx="170" ry="115" transform="rotate(-20)"/><ellipse rx="240" ry="160" transform="rotate(-20)"/><ellipse rx="320" ry="215" transform="rotate(-20)"/></g>
  <g transform="translate(150 820)"><ellipse rx="70" ry="45" transform="rotate(15)"/><ellipse rx="130" ry="85" transform="rotate(15)"/><ellipse rx="200" ry="130" transform="rotate(15)"/><ellipse rx="280" ry="180" transform="rotate(15)"/></g>
</svg>

<main>
  <header>
    <div><h1>Virtual Display</h1><small id="ver" class="num"></small></div>
    <div class="sp"></div>
    <button id="lang" aria-label="Language">EN</button>
    <button class="icon" id="theme" aria-label="Passer en thème sombre" title="Thème">
      <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <section class="card hide" id="setup">
    <h2 data-i="setupTitle"></h2>
    <p class="hint" data-i="setupHint"></p>
    <div class="actions"><button class="primary" id="install" data-i="install"></button></div>
    <div class="msg" id="setupMsg"></div>
  </section>

  <div id="app" class="hide" style="display:grid;gap:14px">
    <section class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <h2 style="margin:0" data-i="screensTitle"></h2>
        <span class="pill" id="status"></span>
      </div>
      <p class="hint" data-i="screensHint"></p>
      <div class="actions">
        <button id="add" data-i="add"></button>
        <button class="primary" id="apply" disabled data-i="apply"></button>
        <button class="danger" id="off" data-i="off"></button>
      </div>
      <div class="msg" id="msg" role="status"></div>
      <div class="screens" id="screens" style="margin:12px 0 0"></div>
    </section>

    <section class="card">
      <h2 data-i="keyTitle"></h2>
      <p class="hint" data-i="keyHint"></p>
      <div class="row"><div class="key" id="key" tabindex="0" role="button" aria-label="Définir le raccourci"></div><button id="keySave" disabled data-i="save"></button></div>
      <div class="msg" id="keyMsg" role="status"></div>
    </section>

    <section class="card">
      <h2 data-i="updTitle"></h2>
      <p class="hint" id="upd"></p>
      <div class="actions"><button id="check" data-i="check"></button><button class="primary hide" id="doUpdate" data-i="doUpdate"></button><button id="quit" data-i="quit"></button></div>
    </section>
  </div>
</main>
<dialog id="addDlg">
  <h2 data-i="addTitle"></h2>
  <p class="hint" style="margin:0" data-i="addHint"></p>
  <div class="seg" id="addSeg" role="radiogroup"></div>
  <div class="actions"><button id="addCancel" data-i="cancel"></button><button class="primary" id="addOk" data-i="addOk"></button></div>
</dialog>
<div class="busy hide" id="busy"><div class="card"><div class="spin"></div><span id="busyTxt"></span></div></div>

<script>
const TOKEN="{{TOKEN}}";
const $=s=>document.querySelector(s);
const I18N={
fr:{
 setupTitle:"Installation",setupHint:"Un seul clic : installe le pilote d'écran virtuel Parsec (téléchargé chez Parsec, signé), l'application, le démarrage automatique avec Windows et le raccourci du menu Démarrer.",
 install:"Installer VDP",installing:"Installation en cours… cette fenêtre se rouvrira à la fin.",
 screensTitle:"Écrans virtuels",screensHint:"Un écran virtuel reste « allumé » pour Windows quand tes écrans physiques sont éteints : les benchs GPU mesurent alors la vraie charge d'affichage.",
 add:"+ Ajouter un écran",apply:"Appliquer",off:"Tout désactiver",none:"Aucun écran virtuel.",noScreen:"Aucun écran",
 active:n=>n+(n>1?" actifs":" actif"),screen:n=>"Écran "+n,resolution:n=>"Résolution écran "+n,remove:n=>"Supprimer l'écran "+n,
 addTitle:"Ajouter un écran",addHint:"Choisis la résolution du nouvel écran virtuel.",cancel:"Annuler",addOk:"Ajouter",
 applying:"Application des écrans…",applied:"Écrans appliqués.",adding:"Ajout de l'écran…",deactivating:"Désactivation…",allOff:"Tous les écrans virtuels sont désactivés.",
 keyTitle:"Raccourci « tout désactiver »",keyHint:"Aucun par défaut. Clique le champ puis appuie sur ta combinaison (au moins un modificateur). Échap pour effacer.",
 save:"Enregistrer",noKey:"Aucun raccourci",pressKey:"Appuie sur la combinaison…",needMod:"Ajoute un modificateur (Ctrl, Alt, Maj ou Win).",keySaved:"Raccourci enregistré.",keyCleared:"Raccourci effacé.",keyAria:"Définir le raccourci",
 updTitle:"Mises à jour",check:"Rechercher",doUpdate:"Mettre à jour",quit:"Quitter l'application",checking:"Recherche des mises à jour…",
 newer:(l,c)=>`Version <b class="num">${l}</b> disponible (installée : <span class="num">${c}</span>).`,upToDate:c=>`À jour — <span class="num">${c}</span>.`,checkFail:m=>"Recherche impossible : "+m,
 updating:"Téléchargement et installation…",dev:"version de développement",themeDark:"Passer en thème sombre",themeLight:"Passer en thème clair",theme:"Thème",badReply:"réponse invalide"},
en:{
 setupTitle:"Installation",setupHint:"One click: installs the Parsec virtual display driver (downloaded from Parsec, signed), the app, autostart with Windows and the Start menu shortcut.",
 install:"Install VDP",installing:"Installing… this window will reopen when done.",
 screensTitle:"Virtual displays",screensHint:"A virtual display stays “on” for Windows while your physical monitors are off, so GPU benchmarks measure the real display load.",
 add:"+ Add a display",apply:"Apply",off:"Deactivate all",none:"No virtual displays.",noScreen:"No display",
 active:n=>n+" active",screen:n=>"Display "+n,resolution:n=>"Display "+n+" resolution",remove:n=>"Remove display "+n,
 addTitle:"Add a display",addHint:"Pick the resolution of the new virtual display.",cancel:"Cancel",addOk:"Add",
 applying:"Applying displays…",applied:"Displays applied.",adding:"Adding display…",deactivating:"Deactivating…",allOff:"All virtual displays are deactivated.",
 keyTitle:"“Deactivate all” shortcut",keyHint:"None by default. Click the field, then press your combination (at least one modifier). Esc to clear.",
 save:"Save",noKey:"No shortcut",pressKey:"Press the combination…",needMod:"Add a modifier (Ctrl, Alt, Shift or Win).",keySaved:"Shortcut saved.",keyCleared:"Shortcut cleared.",keyAria:"Set the shortcut",
 updTitle:"Updates",check:"Check",doUpdate:"Update",quit:"Quit the app",checking:"Checking for updates…",
 newer:(l,c)=>`Version <b class="num">${l}</b> available (installed: <span class="num">${c}</span>).`,upToDate:c=>`Up to date — <span class="num">${c}</span>.`,checkFail:m=>"Check failed: "+m,
 updating:"Downloading and installing…",dev:"development build",themeDark:"Switch to dark theme",themeLight:"Switch to light theme",theme:"Theme",badReply:"invalid response"}
};
let lang=/^fr/i.test(navigator.language)?"fr":"en";
try{lang=localStorage.getItem("lang")||lang}catch(e){}
const t=(k,...a)=>{const v=I18N[lang][k];return typeof v==="function"?v(...a):v};
let S=null, screens=[], hotkey="", pendingKey="", updState=null;

const api=async(p,b={})=>{
  const r=await fetch("/api/"+p,{method:"POST",headers:{"X-Token":TOKEN,"Content-Type":"application/json"},body:JSON.stringify(b)});
  const j=await r.json().catch(()=>({error:t("badReply")}));
  if(!r.ok) throw new Error(j.error||r.statusText);
  return j.data;
};
const say=(el,txt,cls)=>{el.textContent=txt;el.className="msg "+(cls||"")};
let working=0;
const busy=async(txt,fn)=>{working++;$("#busyTxt").textContent=txt;$("#busy").classList.remove("hide");try{return await fn()}finally{working--;$("#busy").classList.add("hide")}};
// toute erreur de script part dans log.txt (la fenêtre n'a pas de console)
const report=e=>api("log",{msg:String(e&&e.stack||e)}).catch(()=>{});
addEventListener("error",e=>report(e.error||e.message));addEventListener("unhandledrejection",e=>report(e.reason));

// thème : clair par défaut, jamais lu depuis le système
const setTheme=th=>{document.documentElement.setAttribute("data-hx",th);try{localStorage.setItem("hx",th)}catch(e){}applyText()};
$("#theme").onclick=()=>setTheme(document.documentElement.getAttribute("data-hx")==="dark"?"light":"dark");
try{setTheme(localStorage.getItem("hx")==="dark"?"dark":"light")}catch(e){setTheme("light")}

$("#lang").onclick=()=>{lang=lang==="fr"?"en":"fr";try{localStorage.setItem("lang",lang)}catch(e){}applyText();if(S)render();showUpd();["#msg","#keyMsg"].forEach(s=>say($(s),""))};

function applyText(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  $("#lang").textContent=lang==="fr"?"EN":"FR";
  const dark=document.documentElement.getAttribute("data-hx")==="dark";
  $("#theme").setAttribute("aria-label",t(dark?"themeLight":"themeDark"));$("#theme").title=t("theme");
  $("#key").setAttribute("aria-label",t("keyAria"));
}

const dirty=()=>JSON.stringify(screens)!==JSON.stringify(S.screens);
const presetRadios=(name,sel)=>S.presets.map(p=>`<span style="flex:1;display:flex"><input type="radio" name="${name}" id="${name}${p.id}" value="${p.id}" ${p.id===sel?"checked":""}><label for="${name}${p.id}">${p.label}</label></span>`).join("");

function render(){
  $("#ver").textContent=S.version==="dev"?t("dev"):"v"+S.version.replace(/^v/,"");
  $("#setup").classList.toggle("hide",S.installed&&S.driver);
  $("#app").classList.toggle("hide",!(S.installed&&S.driver));
  const st=$("#status");
  if(S.active>0){st.className="pill ok";st.innerHTML="<i></i>"+t("active",S.active)}
  else{st.className="pill wait";st.innerHTML="<i></i>"+t("noScreen")}
  const box=$("#screens");box.innerHTML="";
  screens.forEach((id,i)=>{
    const el=document.createElement("div");el.className="screen";
    el.innerHTML=`<span class="name">${t("screen",i+1)}</span><div class="seg" role="radiogroup" aria-label="${t("resolution",i+1)}">${presetRadios("r"+i,id)}</div><button class="icon" aria-label="${t("remove",i+1)}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
    el.querySelectorAll("input").forEach(r=>r.onchange=()=>{screens[i]=r.value;render()});
    el.querySelector("button").onclick=()=>{screens.splice(i,1);render()};
    box.appendChild(el);
  });
  if(!screens.length){box.innerHTML=`<p class="hint" style="margin:0">${t("none")}</p>`}
  $("#add").disabled=screens.length>=4;
  $("#apply").disabled=!dirty();
  $("#key").innerHTML=pendingKey||hotkey?(pendingKey||hotkey).split("+").map(x=>`<kbd>${x}</kbd>`).join(""):t("noKey");
  $("#keySave").disabled=pendingKey===""||pendingKey===hotkey;
}

async function load(first){
  S=await api("state");
  if(first||!dirty()){screens=[...S.screens]}
  if(first){hotkey=S.hotkey}
  render();
}

async function applyNow(txt){
  try{await busy(txt,()=>api("apply",{screens}));say($("#msg"),t("applied"),"ok")}
  catch(e){report(e);say($("#msg"),e.message,"alert")}
  await load(true).catch(()=>{});
}
// ajout : fenêtre modale, puis application immédiate
$("#add").onclick=()=>{$("#addSeg").innerHTML=presetRadios("a","1080");$("#addDlg").showModal()};
$("#addCancel").onclick=()=>$("#addDlg").close();
$("#addOk").onclick=()=>{const v=document.querySelector('input[name="a"]:checked').value;$("#addDlg").close();screens.push(v);render();applyNow(t("adding"))};
$("#apply").onclick=()=>applyNow(t("applying"));
$("#off").onclick=async()=>{
  try{await busy(t("deactivating"),()=>api("deactivate"));say($("#msg"),t("allOff"),"ok");await load(true)}
  catch(e){report(e);say($("#msg"),e.message,"alert")}
};

// raccourci : capture de la combinaison
const key=$("#key");
key.onclick=()=>{key.classList.add("rec");key.textContent=t("pressKey")};
key.onblur=()=>{key.classList.remove("rec");render()};
key.onkeydown=e=>{
  if(!key.classList.contains("rec")){if(e.key==="Enter")key.onclick();return}
  e.preventDefault();
  if(e.key==="Escape"||e.key==="Backspace"){pendingKey="";hotkey!==""?savePending(""):0;key.blur();return}
  if(["Control","Alt","Shift","Meta"].includes(e.key))return;
  let n=e.code.replace(/^Key|^Digit/,"");
  const map={ArrowLeft:"Left",ArrowRight:"Right",ArrowUp:"Up",ArrowDown:"Down"};
  n=map[n]||n;
  const mods=[e.ctrlKey&&"Ctrl",e.altKey&&"Alt",e.shiftKey&&"Shift",e.metaKey&&"Win"].filter(Boolean);
  if(!mods.length){say($("#keyMsg"),t("needMod"),"wait");return}
  pendingKey=[...mods,n].join("+");say($("#keyMsg"),"","");key.blur();
};
async function savePending(v){
  try{await api("hotkey",{hotkey:v});hotkey=v;pendingKey="";say($("#keyMsg"),t(v?"keySaved":"keyCleared"),"ok")}
  catch(e){say($("#keyMsg"),e.message,"alert")}
  render();
}
$("#keySave").onclick=()=>savePending(pendingKey);

$("#install").onclick=async()=>{
  try{await api("install");say($("#setupMsg"),t("installing"),"info")}
  catch(e){say($("#setupMsg"),e.message,"alert")}
};
$("#quit").onclick=()=>api("quit").catch(()=>{});

// état de la recherche de mise à jour, rejoué au changement de langue
function showUpd(){
  const u=updState,el=$("#upd");
  if(!u){el.textContent=t("checking");return}
  if(u.err){el.textContent=t("checkFail",u.err);return}
  if(u.newer){el.innerHTML=t("newer",u.latest,S.version);$("#doUpdate").classList.remove("hide")}
  else el.innerHTML=t("upToDate",S.version);
}
async function check(){
  updState=null;showUpd();
  try{updState=await api("update/check")}catch(e){updState={err:e.message}}
  showUpd();
}
$("#check").onclick=check;
$("#doUpdate").onclick=async()=>{try{await busy(t("updating"),()=>api("update/apply"))}catch(e){$("#upd").textContent=e.message}};

applyText();showUpd();
load(true).then(()=>{if(S.installed)check()}).catch(e=>say($("#msg"),e.message,"alert"));
setInterval(()=>{if(!working&&!$("#addDlg").open)load(false).catch(()=>{})},3000);
</script>
</body>
</html>
